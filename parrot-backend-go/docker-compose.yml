version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: parrot-pg
    environment:
      POSTGRES_USER: parrot
      POSTGRES_PASSWORD: Parrot123
      POSTGRES_DB: parrot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parrot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parrot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 阶段 2：etcd 服务注册与发现
  etcd:
    image: bitnami/etcd:3.5
    container_name: parrot-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 阶段 2.3：user-service 微服务
  user-service:
    build:
      context: .
      target: user-service
    container_name: parrot-user
    env_file: .env
    environment:
      ETCD_ADDR: etcd:2379
      USER_SERVICE_PORT: "8890"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

  # 阶段 2.3：voice-service 微服务
  voice-service:
    build:
      context: .
      target: voice-service
    container_name: parrot-voice
    env_file: .env
    environment:
      ETCD_ADDR: etcd:2379
      VOICE_SERVICE_PORT: "8889"
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

  # 阶段 2.2：dubbing-service 微服务
  dubbing-service:
    build:
      context: .
      target: dubbing-service
    container_name: parrot-dubbing
    env_file: .env
    environment:
      ETCD_ADDR: etcd:2379
      DUBBING_SERVICE_PORT: "8888"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      voice-service:
        condition: service_started
    restart: unless-stopped

  # 网关（Gin HTTP 服务）
  server:
    build:
      context: .
      target: gateway
    container_name: parrot-server
    env_file: .env
    environment:
      ETCD_ADDR: etcd:2379
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      user-service:
        condition: service_started
      voice-service:
        condition: service_started
      dubbing-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  etcd_data:
