version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: parrot-pg
    environment:
      POSTGRES_USER: parrot
      POSTGRES_PASSWORD: Parrot123
      POSTGRES_DB: parrot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parrot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parrot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
